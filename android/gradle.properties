# Android Gradle Plugin Configuration
# Aggressive GC settings for memory-constrained systems

# Heap settings - reduced from 8G to 4G to prevent OOM
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# Garbage Collection Optimization
# Use G1GC for better latency on low-memory systems
# Uncomment the following line if you encounter GC pauses:
# org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache (reduces configuration time)
org.gradle.configuration-cache=true

# Enable build cache
org.gradle.caching=true

# JVM options for Gradle
# -XX:+UseParallelGC uses parallel garbage collector for throughput
# -XX:+UseStringDeduplication reduces string memory footprint
# -XX:+AlwaysPreTouch pre-allocates heap pages (reduces runtime pauses)

# Android-specific settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin daemon JVM args
kotlin.daemon.jvmargs=-Xmx1G -XX:+UseParallelGC

# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true
android.nonFinalResIds=true