name: mobile_app
description: "Student Pal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path: ^1.9.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  file_picker: ^11.0.0 
  open_filex: ^4.7.0 
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.0.7
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  alarm: ^4.0.0
  google_generative_ai: ^0.4.4
  flutter_dotenv: ^5.1.0
  flip_card: ^0.7.0
  connectivity_plus: ^6.0.3
  dio: ^5.4.0
  flutter_riverpod: ^3.3.1
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  permission_handler: ^11.3.1
  android_intent_plus: ^4.0.0
  package_info_plus: ^8.0.0
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/splogo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/splogo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/meow.wav
    - .env
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
